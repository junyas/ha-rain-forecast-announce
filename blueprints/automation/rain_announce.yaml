blueprint:
  name: 雨の降り出し・止み・予報通知をスマートスピーカーで知らせる / Announce Rain Start, Stop and Forecast
  description: >-
    降水強度センサーの値から雨の降り出しと止みの判定と直近1時間の予測を元に、スマートスピーカーに読み上げさせる。
    在宅・時間帯・カレンダーの予定で、しゃべってよいときだけ発話する。
    事前に configuration.yaml へ降水強度センサー、雨フラグ、予報時刻の記憶用 input_datetime を追加しておくこと（README 参照）。

    Announces on a smart speaker when rain starts, stops and forecast for rain, based on a rainfall sensor.
    Speaks only when someone is home, within the set hours, and with no timed calendar event.
    Add the rainfall sensor, rain flag and forecast-start memory input_datetime to configuration.yaml first (see README).
  domain: automation
  source_url: https://github.com/junyas/ha-rain-forecast-announce/blob/main/blueprints/automation/rain_announce.yaml
  input:
    sources:
      name: センサーとフラグ / Sensor and flag
      input:
        rain_sensor:
          name: 降水強度センサー（mm/h） / Rainfall sensor (mm/h)
          selector:
            entity:
              domain: sensor
        rain_flag:
          name: 雨フラグ / Rain flag
          description: 雨が降っている間 ON になる input_boolean。発話しないときも更新する / input_boolean that is ON while it rains. Updated even when nothing is announced
          selector:
            entity:
              domain: input_boolean
        forecast_start_memory:
          name: 予報した降り始め時刻の記憶 / Remembered forecast start time
          description: configuration.yaml に追加した input_datetime.yolp_last_forecast_rain_start を選択 / Select input_datetime.yolp_last_forecast_rain_start added to configuration.yaml
          selector:
            entity:
              domain: input_datetime
    thresholds:
      name: 判定のしきい値 / Thresholds
      input:
        start_threshold:
          name: 降り出しのしきい値 / Rain start threshold
          default: 0.5
          selector:
            number:
              min: 0.1
              max: 10
              step: 0.1
              unit_of_measurement: mm/h
        stop_threshold:
          name: 止みのしきい値 / Rain stop threshold
          description: 降り出しより低くして、境目で何度も発話しないようにする / Keep it lower than the start threshold to avoid repeated announcements near the boundary
          default: 0.1
          selector:
            number:
              min: 0
              max: 10
              step: 0.1
              unit_of_measurement: mm/h
        stop_minutes:
          name: 止みと判定するまでの継続時間 / Minutes below threshold before rain stops
          default: 10
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: min
        forecast_threshold:
          name: 予報通知のしきい値 / Forecast announcement threshold
          description: この値以上の降水強度が今後 60 分に予測されたら通知する / Announce when forecast rainfall reaches this intensity within the next 60 minutes
          default: 0.5
          selector:
            number:
              min: 0.1
              max: 10
              step: 0.1
              unit_of_measurement: mm/h
    speaker_settings:
      name: 読み上げ / Announcement
      input:
        speaker:
          name: スピーカー / Speaker
          selector:
            entity:
              domain: media_player
        tts_engine:
          name: TTS エンジン / TTS engine
          selector:
            entity:
              domain: tts
        language:
          name: 言語 / Language
          default: ja
          selector:
            text:
        volume:
          name: 読み上げ時の音量 / Volume while speaking
          default: 0.6
          selector:
            number:
              min: 0
              max: 1
              step: 0.05
        restore_seconds:
          name: 元の音量に戻すまでの秒数 / Seconds before restoring volume
          default: 6
          selector:
            number:
              min: 1
              max: 30
              unit_of_measurement: s
        start_message:
          name: 降り出しの文言 / Rain start message
          default: 雨が降ってきました
          selector:
            text:
        stop_message:
          name: 止みの文言 / Rain stop message
          default: 雨がやんできました
          selector:
            text:
        forecast_message:
          name: 予報の文言 / Forecast message
          description: "{minutes} は降り始めまでの分数、{max} は今後 60 分の最大降水強度（mm/h）に置き換わります / {minutes} is minutes until rain starts; {max} is the maximum forecast intensity (mm/h) in the next 60 minutes"
          default: "雨が{minutes}分後に降り始めそうです。今後1時間の最大降水量は{max}mmの予想です"
          selector:
            text:
    guard:
      name: 発話してよいときの条件 / When to speak
      input:
        persons:
          name: 在宅を判定する人 / People to check for presence
          description: 誰か 1 人でも home なら発話する。空なら在宅を見ない / Speaks if anyone is home. Leave empty to skip
          default: []
          selector:
            entity:
              domain: person
              multiple: true
        calendars:
          name: 予定を見るカレンダー / Calendars to check
          description: 時間指定の予定が進行中なら発話しない。終日の予定は無視する。空なら予定を見ない / Stays silent during timed events. All-day events are ignored. Leave empty to skip
          default: []
          selector:
            entity:
              domain: calendar
              multiple: true
        speak_from:
          name: 発話する時間帯（開始） / Speak from
          default: "07:00:00"
          selector:
            time:
        speak_until:
          name: 発話する時間帯（終了） / Speak until
          default: "22:00:00"
          selector:
            time:

mode: single

variables:
  yolp_rain_flag: !input rain_flag
  forecast_start_memory: !input forecast_start_memory
  speaker: !input speaker
  persons: !input persons
  calendars: !input calendars
  rainfall_sensor: !input rain_sensor
  rain_start_message: !input start_message
  rain_stop_message: !input stop_message
  rain_forecast_message: !input forecast_message
  rain_forecast_threshold: !input forecast_threshold

triggers:
  - trigger: numeric_state
    id: start
    entity_id: !input rain_sensor
    above: !input start_threshold
  - trigger: numeric_state
    id: stop
    entity_id: !input rain_sensor
    below: !input stop_threshold
    for:
      minutes: !input stop_minutes
  - trigger: state
    id: forecast
    entity_id: !input rain_sensor
    attribute: Weather

conditions:
  - condition: template
    value_template: >-
      {{ (trigger.id == 'start' and is_state(yolp_rain_flag, 'off'))
         or (trigger.id == 'stop' and is_state(yolp_rain_flag, 'on'))
         or trigger.id == 'forecast' }}

actions:
  - condition: template
    value_template: "{{ trigger.id | default('') in ['start', 'stop', 'forecast'] }}"
  - if:
      - condition: trigger
        id: start
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: !input rain_flag
      - action: input_datetime.set_datetime
        target:
          entity_id: !input forecast_start_memory
        data:
          timestamp: 0
  - if:
      - condition: trigger
        id: stop
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: !input rain_flag
  - variables:
      forecast_points: >-
        {{ ((trigger.to_state.attributes.get('Weather', []) if trigger.to_state else [])
            if trigger.id == 'forecast' else (state_attr(rainfall_sensor, 'Weather') or []))
           | selectattr('Type', 'equalto', 'forecast') | list }}
      forecast_minutes: >-
        {% set now_ts = as_timestamp(now()) %}
        {% set ns = namespace(minutes=none) %}
        {% for point in forecast_points %}
          {% set forecast_date = strptime((point.Date | default('', true) | string) ~ '+0900', '%Y%m%d%H%M%z', none) %}
          {% if forecast_date is not none %}
            {% set timestamp = as_timestamp(forecast_date) %}
            {% if now_ts <= timestamp <= now_ts + 3600
                  and point.Rainfall | float(0) > rain_forecast_threshold | float %}
              {% set minutes = ((timestamp - now_ts) / 60) | round(0, 'ceil') | int %}
              {% if ns.minutes is none or minutes < ns.minutes %}
                {% set ns.minutes = minutes %}
              {% endif %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.minutes if ns.minutes is not none else 0 }}
      forecast_start_timestamp: >-
        {% set now_ts = as_timestamp(now()) %}
        {% set ns = namespace(timestamp=0) %}
        {% for point in forecast_points %}
          {% set forecast_date = strptime((point.Date | default('', true) | string) ~ '+0900', '%Y%m%d%H%M%z', none) %}
          {% if forecast_date is not none %}
            {% set timestamp = as_timestamp(forecast_date) %}
            {% if now_ts <= timestamp <= now_ts + 3600
                  and point.Rainfall | float(0) > rain_forecast_threshold | float
                  and (ns.timestamp == 0 or timestamp < ns.timestamp) %}
              {% set ns.timestamp = timestamp %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.timestamp }}
      forecast_max: >-
        {% set now_ts = as_timestamp(now()) %}
        {% set ns = namespace(maximum=0) %}
        {% for point in forecast_points %}
          {% set forecast_date = strptime((point.Date | default('', true) | string) ~ '+0900', '%Y%m%d%H%M%z', none) %}
          {% if forecast_date is not none %}
            {% set timestamp = as_timestamp(forecast_date) %}
            {% if now_ts <= timestamp <= now_ts + 3600 %}
              {% set rainfall = point.Rainfall | float(0) %}
              {% if rainfall > ns.maximum %}
                {% set ns.maximum = rainfall %}
              {% endif %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.maximum }}
  - if:
      - condition: trigger
        id: forecast
      - condition: template
        value_template: >-
          {{ is_state(yolp_rain_flag, 'on')
             or states(rainfall_sensor) | float(0) > rain_forecast_threshold | float
             or forecast_start_timestamp | int(0) == 0 }}
    then:
      - action: input_datetime.set_datetime
        target:
          entity_id: !input forecast_start_memory
        data:
          timestamp: 0
  - if:
      - condition: template
        value_template: >-
          {{ (trigger.id != 'forecast'
              or (forecast_start_timestamp | int(0) > 0
                  and forecast_minutes | int(0) > 0
                  and forecast_max | float(0) > 0
                  and is_state(yolp_rain_flag, 'off')
                  and states(rainfall_sensor) | float(0) <= rain_forecast_threshold | float
                  and forecast_start_timestamp | int(0)
                      != as_timestamp(states(forecast_start_memory), 0) | int(0)))
             and (persons | count == 0
                  or persons | select('is_state', 'home') | list | count > 0) }}
      - condition: time
        after: !input speak_from
        before: !input speak_until
      - condition: template
        value_template: >-
          {{ calendars | select('is_state', 'on')
             | reject('is_state_attr', 'all_day', true) | list | count == 0 }}
    then:
      - variables:
          previous_speaker_volume: "{{ state_attr(speaker, 'volume_level') }}"
      - action: media_player.volume_set
        target:
          entity_id: !input speaker
        data:
          volume_level: !input volume
      - action: tts.speak
        target:
          entity_id: !input tts_engine
        data:
          media_player_entity_id: !input speaker
          message: >-
            {% if trigger.id == 'start' %}
              {{ rain_start_message }}
            {% elif trigger.id == 'stop' %}
              {{ rain_stop_message }}
            {% else %}
              {{ rain_forecast_message
                 | replace('{minutes}', forecast_minutes | string)
                 | replace('{max}', forecast_max | round(1) | string) }}
            {% endif %}
          language: !input language
      - delay:
          seconds: !input restore_seconds
      - action: media_player.volume_set
        target:
          entity_id: !input speaker
        data:
          volume_level: "{{ previous_speaker_volume | float(0.2) }}"
      - if:
          - condition: trigger
            id: forecast
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: !input forecast_start_memory
            data:
              timestamp: "{{ forecast_start_timestamp | int }}"
